<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juego de léxico sanitario</title>

<style>
:root {
    --bg: #0f172a;
    --text: #f8fafc;
    --muted: #cbd5e1;
    --accent: #2563eb;
    --accent-2: #7c3aed;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at top, #1e3a8a 0%, #0f172a 55%, #020617 100%);
    color: var(--text);
    min-height: 100vh;
}

/* INICIO */
#inicio {
    text-align: center;
    padding: 40px 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
}

#inicio h1 {
    margin: 0;
    font-size: 2rem;
    text-shadow: 0 2px 8px rgba(0,0,0,0.35);
}

#inicio p {
    margin: 0;
    color: var(--muted);
}

.logo {
    width: 170px;
    margin: 8px auto 6px;
    display: block;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,0.25));
}

select,
button {
    border: none;
    border-radius: 999px;
    padding: 12px 18px;
    font-size: 1rem;
    font-weight: 700;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

select {
    min-width: 220px;
    background: rgba(255,255,255,0.14);
    color: var(--text);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
}

.nivel-selector {
    position: relative;
    width: min(240px, 100%);
}

.nivel-trigger {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    color: white;
    background: rgba(255,255,255,0.14);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
}

.nivel-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    display: none;
    flex-direction: column;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(15, 23, 42, 0.96);
    box-shadow: 0 12px 24px rgba(0,0,0,0.28);
    z-index: 10;
}

.nivel-selector.abierto .nivel-menu {
    display: flex;
}

.nivel-option {
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text);
    text-align: left;
    padding: 12px 14px;
    cursor: pointer;
}

.nivel-option:hover {
    background: rgba(255,255,255,0.12);
}

button {
    padding: 12px 24px;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    box-shadow: 0 10px 24px rgba(37, 99, 235, 0.35);
}

button:hover,
select:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.22);
}

/* JUEGO */
#juego {
    display: none;
    padding: 16px;
    min-height: 100vh;
    box-sizing: border-box;
    background: linear-gradient(135deg, rgba(15,23,42,0.95) 0%, rgba(2,6,23,0.96) 100%);
}

#info {
    text-align: center;
    margin: 0 auto 14px;
    max-width: 900px;
    padding: 12px 18px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    color: var(--text);
    box-shadow: 0 6px 18px rgba(0,0,0,0.24);
    font-weight: 700;
}

.progreso {
    max-width: 900px;
    margin: 0 auto 14px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.1);
    box-shadow: 0 6px 18px rgba(0,0,0,0.24);
}

.progreso-barra {
    width: 100%;
    height: 10px;
    background: rgba(255,255,255,0.16);
    border-radius: 999px;
    overflow: hidden;
}

.progreso-barra > div {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.3s ease;
}

/* TABLERO */
#tablero {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    max-width: 960px;
    height: calc(100vh - 130px);
    margin: auto;
    padding: 16px 12px;
    overflow-y: auto;
    border-radius: 22px;
    background: rgba(255,255,255,0.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 16px 40px rgba(0,0,0,0.24);
}

.fila {
    display: flex;
    justify-content: center;
    gap: 8px;
    width: 100%;
}

/* CARTAS */
.carta {
    width: var(--ancho, 96px);
    height: var(--alto, 88px);
    border-radius: 14px;
    border: 2px solid rgba(255,255,255,0.22);
    position: relative;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 6px 14px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2);
    background: transparent;
    flex-shrink: 0;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.carta:not(.girada):hover {
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 14px 24px rgba(0,0,0,0.32);
    filter: brightness(1.08);
}

.carta .dorso,
.carta .cara {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    transition: opacity 0.2s ease;
}

.carta .dorso {
    background-image: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(15,23,42,0.16)), url("trasera.png");
    background-size: cover;
    background-position: center;
    opacity: 1;
    z-index: 2;
}

.carta .cara {
    background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
    color: #0f172a;
    text-align: center;
    padding: 6px;
    font-size: var(--fuente, 0.8rem);
    font-weight: 700;
    line-height: 1.15;
    overflow-wrap: break-word;
    word-break: break-word;
    hyphens: auto;
    box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.08);
    opacity: 0;
    z-index: 1;
    pointer-events: none;
}

.carta.girada .cara {
    opacity: 1;
    z-index: 3;
    pointer-events: auto;
}

.carta.girada .dorso {
    opacity: 0;
    z-index: 1;
}

/* FINAL */
#final {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    color: black;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    width: 350px;
    max-height: 80vh;
    overflow: auto;
    box-shadow: 0 20px 45px rgba(0,0,0,0.28);
}

#final img {
    width: 100px;
    margin-bottom: 10px;
}

/* MÓVIL: cabecera compacta para dejar más espacio al tablero */
@media (max-width: 600px) {
    #juego {
        padding: 8px;
    }
    #info {
        margin-bottom: 8px;
        padding: 8px 12px;
        font-size: 0.85rem;
    }
    .progreso {
        margin-bottom: 8px;
        padding: 6px 10px;
    }
    #tablero {
        height: calc(100vh - 118px);
        padding: 10px 8px;
        gap: 6px;
    }
    .fila {
        gap: 6px;
    }
    #final {
        width: 92vw;
        max-height: 85vh;
    }
}
</style>
</head>

<body>

<!-- INICIO -->
<div id="inicio">
<h1>Juego de léxico sanitario</h1>

<img src="logo.png" class="logo">

<p>Empareja elementos léxicos con su significado</p>

<div class="nivel-selector" id="nivelSelector">
    <button id="nivelTrigger" class="nivel-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span id="nivelTexto">Fácil (6 parejas)</span>
        <span>▾</span>
    </button>
    <div class="nivel-menu" role="listbox">
        <button type="button" class="nivel-option" data-value="6" role="option">Fácil (6 parejas)</button>
        <button type="button" class="nivel-option" data-value="12" role="option">Medio (12 parejas)</button>
        <button type="button" class="nivel-option" data-value="24" role="option">Difícil (24 parejas)</button>
    </div>
</div>

<select id="nivel" aria-label="Nivel de dificultad" style="display:none;">
    <option value="6" selected>Fácil (6 parejas)</option>
    <option value="12">Medio (12 parejas)</option>
    <option value="24">Difícil (24 parejas)</option>
</select>

<br><br>
<button onclick="iniciarJuego()">🎮 Jugar</button>
</div>

<!-- JUEGO -->
<div id="juego">
<div id="info">
Giros: <span id="movimientos">0</span> |
Puntos: <span id="puntos">0</span>
</div>

<div class="progreso">
    <div class="progreso-barra">
        <div id="progresoInterior"></div>
    </div>
</div>

<div id="tablero"></div>
</div>

<!-- FINAL -->
<div id="final"></div>

<script>

let primera=null;
let segunda=null;
let bloqueado=false;

let aciertos=0;
let total=0;

let movimientos=0;
let puntos=0;
let intentos=0;

let usadas=[];
let audioContext=null;

function reproducirSonido(tipo){
    try {
        if(!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        const now=audioContext.currentTime;
        const oscillator=audioContext.createOscillator();
        const gain=audioContext.createGain();
        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        let frecuencia=440;
        if(tipo==='acierto') frecuencia=660;
        if(tipo==='error') frecuencia=220;

        oscillator.type='sine';
        oscillator.frequency.setValueAtTime(frecuencia, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
        oscillator.start(now);
        oscillator.stop(now + 0.15);
    } catch (e) {}
}

function actualizarProgreso(){
    const totalParejas = total || 1;
    const porcentaje = Math.min(100, Math.round((aciertos / totalParejas) * 100));
    document.getElementById('progresoInterior').style.width = `${porcentaje}%`;
}

function inicializarSelectorNivel(){
    const selector=document.getElementById("nivelSelector");
    const trigger=document.getElementById("nivelTrigger");
    const select=document.getElementById("nivel");
    const texto=document.getElementById("nivelTexto");

    function actualizarTexto(){
        const opcion=Array.from(select.options).find(op=>op.value===select.value);
        texto.textContent=opcion ? opcion.text : "Fácil (6 parejas)";
    }

    trigger.addEventListener("click", ()=>{
        selector.classList.toggle("abierto");
        trigger.setAttribute("aria-expanded", selector.classList.contains("abierto") ? "true" : "false");
    });

    document.querySelectorAll(".nivel-option").forEach(boton=>{
        boton.addEventListener("click", ()=>{
            select.value=boton.dataset.value;
            actualizarTexto();
            selector.classList.remove("abierto");
            trigger.setAttribute("aria-expanded", "false");
        });
    });

    document.addEventListener("click", (event)=>{
        if(!selector.contains(event.target)){
            selector.classList.remove("abierto");
            trigger.setAttribute("aria-expanded", "false");
        }
    });

    actualizarTexto();
}

inicializarSelectorNivel();

/* ✅ BASE COMPLETA */
let baseDatos = [

["a-, an-","sin, ausencia"],
["hipo-","por debajo"],
["hiper-","exceso"],
["bradi-","lento"],
["taqui-","rápido"],
["intra-","dentro"],
["inter-","entre"],
["peri-","alrededor"],
["retro-","detrás"],
["epi-","sobre"],
["trans-","a través"],
["sub-","debajo"],
["supra-","encima"],
["endo-","dentro"],
["ecto-","fuera"],
["micro-","pequeño"],
["macro-","grande"],
["mono-","uno"],
["bi-","dos"],
["tri-","tres"],
["poli-","muchos"],
["pre-","antes"],
["post-","después"],
["anti-","contra"],
["auto-","propio"],

["cardio-","corazón"],
["dermo-","piel"],
["hepato-","hígado"],
["neumo-","pulmón"],
["gastro-","estómago"],
["nefro-","riñón"],
["neuro-","sistema nervioso"],
["osteo-","hueso"],
["artro-","articulación"],
["angio-","vasos"],
["hemo-","sangre"],
["rino-","nariz"],
["oto-","oído"],
["oftalmo-","ojo"],
["odonto-","diente"],
["mi/o-","músculo"],
["lip/o-","grasa"],
["aden/o-","glándula"],
["cefalo-","cabeza"],

["cian/o","azul"],
["eritro","rojo"],
["melan/o","negro"],
["leuc/o","blanco"],
["xant/o","amarillo"],

["-itis","inflamación"],
["-algia","dolor"],
["-oma","tumor"],
["-osis","anormal"],
["-ectomía","extirpación"],
["-tomía","incisión"],
["-scopia","exploración"],
["-grafía","registro"],
["-logía","estudio"],
["-emia","sangre"],
["-uria","orina"],
["-patía","enfermedad"],
["-terapia","tratamiento"],
["-megalia","agrandamiento"],
["-penia","disminución"]

];

function iniciarJuego(){

    document.getElementById("inicio").style.display="none";
    document.getElementById("juego").style.display="block";

    let tablero=document.getElementById("tablero");
    tablero.innerHTML="";
    document.getElementById("final").style.display="none";

    movimientos=0;
    document.getElementById('progresoInterior').style.width='0%';
    puntos=0;
    intentos=0;
    aciertos=0;

    actualizarInfo();
    actualizarProgreso();

    let nivel=parseInt(document.getElementById("nivel").value);
    total=nivel;

    /* ✅ GARANTIZA SIEMPRE 36 PAREJAS EN DIFÍCIL */
    let seleccion=mezclar([...baseDatos]).slice(0,total);

    usadas=seleccion;

    let cartas=[];

    seleccion.forEach(par=>{
        cartas.push({valor:par[0], pareja:par[1]});
        cartas.push({valor:par[1], pareja:par[0]});
    });

    cartas=mezclar(cartas);

    /* Patrones piramidales estilo Mahjong: filas que se ensanchan hacia el centro */
    const vistaMovil = window.innerWidth < 640;
    let patron;
    if (nivel === 6) {
        patron = [2,3,4,3];
    } else if (nivel === 12) {
        patron = [4,5,6,5,4];
    } else {
        patron = vistaMovil ? [4,5,6,6,6,6,6,5,4] : [4,5,7,8,8,7,5,4];
    }

    /* Tamaño dinámico de cartas para que todo el montículo quepa en pantalla */
    const maxEnFila = Math.max(...patron);
    const anchoDisponible = Math.min(tablero.clientWidth, 960) - 24;
    const gapDisponible = vistaMovil ? 6 : 8;
    let anchoCarta = Math.max(46, Math.min(
        (anchoDisponible - (maxEnFila - 1) * gapDisponible) / maxEnFila,
        Math.floor((window.innerHeight - 220) / patron.length - gapDisponible)
    ));

    /* Si aun así la fila más ancha no cabe, se encogen las cartas para evitar desbordes */
    const espacioNecesario = maxEnFila * anchoCarta + (maxEnFila - 1) * gapDisponible;
    if (espacioNecesario > anchoDisponible) {
        anchoCarta = Math.max(30, Math.floor((anchoDisponible - (maxEnFila - 1) * gapDisponible) / maxEnFila));
    }

    const altoCarta = Math.max(40, Math.round(anchoCarta * 0.92));

    tablero.style.setProperty('--ancho', anchoCarta + 'px');
    tablero.style.setProperty('--alto', altoCarta + 'px');

    /* Fuente proporcional al tamaño de la carta, con mínimo legible */
    const tamanoFuente = Math.max(8, Math.min(15, anchoCarta * 0.18));
    tablero.style.setProperty('--fuente', Math.round(tamanoFuente * 10) / 10 + 'px');

    const filasDOM = [];
    patron.forEach(n => {
        const fila = document.createElement("div");
        fila.className = "fila";
        tablero.appendChild(fila);
        filasDOM.push(fila);
    });

    let indice = 0;
    for (let i = 0; i < patron.length; i++) {
        for (let j = 0; j < patron[i]; j++) {
            const dato = cartas[indice++];
            let carta = document.createElement("div");
            carta.className = "carta";

            carta.dataset.valor = dato.valor;
            carta.dataset.pareja = dato.pareja;

            let dorso = document.createElement("div");
            dorso.className = "dorso";

            let texto = document.createElement("div");
            texto.className = "cara";
            texto.textContent = dato.valor;

            carta.appendChild(dorso);
            carta.appendChild(texto);
            carta.onclick = () => girar(carta);

            filasDOM[i].appendChild(carta);
        }
    }
}

function girar(carta){

    if(bloqueado) return;
    if(carta.classList.contains("girada")) return;

    carta.classList.add("girada");
    reproducirSonido('giro');
    movimientos++;
    actualizarInfo();

    if(!primera){
        primera=carta;
        return;
    }

    segunda=carta;
    comprobar();
}

function comprobar(){

    bloqueado=true;
    intentos++;

    if(primera.dataset.pareja===segunda.dataset.valor){
        puntos+=10;
        aciertos++;
        reproducirSonido('acierto');
        actualizarProgreso();

        setTimeout(()=>{
            primera.style.visibility="hidden";
            segunda.style.visibility="hidden";

            if(aciertos===total){
                finalJuego();
            }

            reset();
        },400);

    } else {

        puntos-=3;
        reproducirSonido('error');

        setTimeout(()=>{
            primera.classList.remove("girada");
            segunda.classList.remove("girada");
            reset();
        },800);
    }

    actualizarInfo();
}

function reset(){
    primera=null;
    segunda=null;
    bloqueado=false;
}

function actualizarInfo(){
    document.getElementById("movimientos").textContent=movimientos;
    document.getElementById("puntos").textContent=puntos;
}

function finalJuego(){

    let final=document.getElementById("final");

    let porcentaje = Math.round((aciertos/intentos)*100);

    final.innerHTML="<h2>🎉 Resultado</h2>";
    final.innerHTML+='<img src="logo.png">';

    final.innerHTML+=`<p><b>Puntos:</b> ${puntos}</p>`;
    final.innerHTML+=`<p><b>Giros:</b> ${movimientos}</p>`;
    final.innerHTML+=`<p><b>Acierto:</b> ${porcentaje}%</p>`;

    final.innerHTML+="<h3>Repaso</h3>";

    usadas.forEach(p=>{
        final.innerHTML+=`<p><b>${p[0]}</b> → ${p[1]}</p>`;
    });

    final.innerHTML+="<br><button onclick='location.reload()'>Reiniciar</button>";

    final.style.display="block";
}

function mezclar(arr){
    return arr.sort(()=>Math.random()-0.5);
}

</script>

</body>
</html>
